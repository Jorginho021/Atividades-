<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Verificação</title>
  <style>
    button {
      padding: 10px;
      background: #c0392b;
      color: white;
    }
  </style>
</head>
<body>
  <button onclick="verificarNumero()">Verificar</button>
  <script>
    function verificarNumero() {
      const numero = Number(prompt("Digite um número:"));
      if (numero > 10) {
        console.log("O número é maior que 10.");
      } else {
        console.log("O número NÃO é maior que 10.");
      }
    }
  </script>
</body>
</html>
