<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Contador</title>
  <style>
    button {
      padding: 15px;
      background-color: #27ae60;
      color: white;
    }
  </style>
</head>
<body>
  <button onclick="contar()">Clique Aqui</button>
  <script>
    let contador = 0;
    function contar() {
      contador++;
      alert(`Você clicou ${contador} vezes.`);
    }
  </script>
</body>
</html>
