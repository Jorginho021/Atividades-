<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Tipos</title>
  <style>
    h1 {
      color: darkblue;
      font-size: 24px;
    }
  </style>
</head>
<body>
  <h1>Verifique o Console</h1>
  <script>
    let texto = "Olá";
    let numero = 123;
    let logico = true;
    let lista = [1, 2, 3];
    let objeto = { nome: "João", idade: 30 };
    let nulo = null;
    let indefinido;

    console.log("String:", texto);
    console.log("Number:", numero);
    console.log("Boolean:", logico);
    console.log("Array:", lista);
    console.log("Object:", objeto);
    console.log("Null:", nulo);
    console.log("Undefined:", indefinido);
  </script>
</body>
</html>
