<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Soma Convertida</title>
  <style>
    button {
      padding: 10px;
      background: #9b59b6;
      color: white;
    }
  </style>
</head>
<body>
  <button onclick="somarConvertido()">Somar</button>
  <script>
    function somarConvertido() {
      const a = prompt("Digite o primeiro número:");
      const b = prompt("Digite o segundo número:");
      const resultado = Number(a) + Number(b);
      alert(`Resultado da soma: ${resultado}`);
    }
  </script>
</body>
</html>
